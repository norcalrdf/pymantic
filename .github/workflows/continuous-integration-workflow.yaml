name: Github Actions CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pymantic-ci:
    name: Pymantic Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install tox
      - run: tox

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: "pip"
      - run: pip install tox
      - run: tox -e lint
