[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
# The second -W comes after "-W always" so it wins for that one warning:
# betamax 0.9.0, the latest release, calls datetime.utcnow() loading cassettes
# in tests/test_SPARQL.py. Fixed upstream but unreleased:
# https://github.com/betamaxpy/betamax/issues/209
addopts = """-W always
    -W 'ignore:datetime.datetime.utcnow() is deprecated:DeprecationWarning:betamax.adapter'"""
testpaths = [
    "tests",
]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["src", "tests"]
skip_glob = ["docs/*"]
include_trailing_comma = true
force_grid_wrap = false
combine_as_imports = true
line_length = 79
force_sort_within_sections = true
no_lines_before = "THIRDPARTY"
sections = "FUTURE,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
default_section = "THIRDPARTY"
known_first_party = "pymantic"