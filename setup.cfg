[metadata]
name = pymantic
version = attr: pymantic.version
author = Gavin Carothers, Nick Pilon
author_email = gavin@carothers.name, npilon@gmail.com
description = Semantic Web and RDF library for Python
long_description = file: README.rst
long_description_content_type = text/x-rst
keywords = RDF N3 Turtle Semantics
url = https://github.com/norcalrdf/pymantic/
license = BSD
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Topic :: Internet :: WWW/HTTP
    Topic :: Scientific/Engineering :: Information Analysis
    Topic :: Text Processing :: Markup
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
package_dir=
    =src
zip_safe = True
include_package_data = True
python_requires = >=3.10
install_requires =
    # 2.32.0 fixes CVE-2024-35195: a Session that once sent verify=False kept
    # skipping certificate verification for later requests to the same host.
    requests>=2.32.0
    pytz
    rdflib
    lark>=1.1.0,<1.4.0

[options.packages.find]
where=src

[options.extras_require]
jsonld =
    pyld
testing =
    pytest
    coverage
    betamax

[flake8]
enable-extensions = G
ignore = E203,E501,W503,D100,D101,D102,D103,D104,D105,D106,D107
# E203 - whitespace before ':' - now recommended
# E501 too long line (80chars+) - handled by black
# W503 line break before binary operator - now recommended
# D100-D107 - missing docstrings; only the style of docstrings that exist
#   is checked for now
# Docstrings follow PEP 257 (flake8-docstrings): a one-line summary ending
# in a period, imperative for functions, then a blank line and the detail.
docstring-convention = pep257
per-file-ignores =
    # Test docstrings are not held to the docstring style.
    tests/*: D
