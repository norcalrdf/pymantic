[tox]

[testenv]
commands =
    pytest {posargs:}
# core tests without the jsonld extra.
extras =
    testing
    !core: jsonld

[testenv:core]
# The tests that need pyld to be missing skip wherever it is installed, so
# check it really is missing here.
commands_pre =
    python -c "from importlib.util import find_spec; import sys; sys.exit(find_spec('pyld') is not None and 'pyld is installed in core')"

[testenv:lint]
skip_install = true
commands =
    flake8 src tests
    isort --check-only --df  src/pymantic tests
    black --check --diff src/pymantic tests
    # build sdist/wheel
    python -m build .
    twine check dist/*
deps =
    flake8~=6.1.0
    black~=26.5
    isort~=5.10
    build
    twine

[testenv:format]
skip_install = true
commands =
    isort src/pymantic tests
    black src/pymantic tests
deps =
    black~=26.5
    isort~=5.10

[testenv:build]
skip_install = true
commands =
    # clean up build/ and dist/ folders
    python -c 'import shutil; shutil.rmtree("build", ignore_errors=True)'
    # build sdist/wheel
    python -m build .
    # Verify all is well
    twine check dist/*

deps =
    build
    twine
