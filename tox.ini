[tox]
# tox-uv lets uv find, or download, every interpreter below.
requires =
    tox-uv>=1.36
env_list =
    py3{11,12,13,14,15}
    core
    pypy312
    graalpy3{12,13}
    pyodide3{12,14}

[testenv]
# python -m, because Pyodide's python is a script, and macOS will not run
# pytest's launcher with another script as its interpreter.
commands =
    python -m pytest {posargs:}
# lxml, which pyld needs, cannot be installed on PyPy 3.12 or Pyodide, so
# those environments test without JSON-LD, as core does on CPython.
extras =
    testing
    py,py3{10,11,12,13,14,15},graalpy3{12,13}: jsonld

[testenv:core]
# The tests that need pyld to be missing skip wherever it is installed, so
# check it really is missing here.
commands_pre =
    python -c "from importlib.util import find_spec; import sys; sys.exit(find_spec('pyld') is not None and 'pyld is installed in core')"

[testenv:pyodide3{12,14}]
# tox does not recognise pyodide in an environment name, and falls back to
# its own interpreter without warning when it cannot parse base_python, so
# check that the tests really run under Emscripten.
base_python =
    pyodide312: pyodide3.12
    pyodide314: pyodide3.14
commands_pre =
    python -c "import sys; sys.exit(sys.platform != 'emscripten' and 'not running on Pyodide: ' + sys.version)"

[testenv:lint]
skip_install = true
commands =
    flake8 src tests scripts
    isort --check-only --df  src/pymantic tests scripts
    black --check --diff src/pymantic tests scripts
    # build sdist/wheel
    python -m build .
    twine check dist/*
deps =
    flake8~=6.1.0
    black~=26.5
    isort~=5.10
    build
    twine

[testenv:format]
skip_install = true
commands =
    isort src/pymantic tests
    black src/pymantic tests
deps =
    black~=26.5
    isort~=5.10

[testenv:build]
skip_install = true
commands =
    # clean up build/ and dist/ folders
    python -c 'import shutil; shutil.rmtree("build", ignore_errors=True)'
    # build sdist/wheel
    python -m build .
    # Verify all is well
    twine check dist/*

deps =
    build
    twine
